system:
  root_dir: /data/opsvault  # OpsVault 全局安装与数据存储根路径
backup:
  storage_path: ""  # 配置文件备份存储路径（留空则默认使用 {system.root_dir}/bak）
  exclude_dirs:     # 备份 system_root 时需要排除的子目录名称
    - "data"
    - "logs"
    - "log"
    - "wwwlogs"
    - "bin"
    - "wwwroot"
docker:
  bind_ip: 0.0.0.0  # 容器端口在宿主机上绑定的IP地址
  cidr: 172.28.0.0/16  # 专用桥接网络的 CIDR 网段
  data_root: ""  # 宿主机数据挂载的根目录（留空则默认使用 {system.root_dir}）
  name_prefix: opsvault  # 容器与网络名称的统一前缀
  network_name: opsvault-net  # Docker 网络桥接网卡名称
  registry_mirrors:  # Docker 镜像源加速源列表（部署或初始化时自动注入 /etc/docker/daemon.json）
    - https://docker.m.daocloud.io
    - https://docker.1ms.run
    - https://docker.kejilion.pro
    - https://dytt.online
    - https://a.ussh.net
  resource_limit:
    cpu_max: "2"  # 每个容器分配的最大 CPU 核心数
    mem_max: 4g  # 每个容器分配的最大内存限制
log:
  level: info  # 日志级别 (debug, info, warn, error)
  storage_path: ""  # 应用程序日志存储路径（留空则默认使用 {system.root_dir}/logs）
mode: docker  # 默认部署模式 (docker 或 binary)
mysql:
  image: mysql:8.0  # MySQL Docker 镜像标签
  port: 3306  # 映射到宿主机的 MySQL 端口
  root_password: ""  # MySQL root 密码（留空则自动生成随机密码）
nginx:
  install_path: /usr/local/nginx  # Nginx 安装目录（仅 binary 模式生效）
  logrotate_path: /etc/logrotate.d/nginx  # Nginx 日志轮转配置文件路径
  openssl_version: latest   # 编译 Nginx 时使用的 OpenSSL 版本，latest=安装时自动获取最新稳定版
  pcre_version: "8.45"  # 编译 Nginx 时使用的 PCRE 版本
  run_group: data  # Nginx 运行时的用户组
  run_user: data  # Nginx 运行时的用户名
  source_root: /usr/local/src/opsvault-nginx  # Nginx 源码下载与编译路径
  ssl_root: ""  # SSL 证书存储目录（留空则默认使用 {system.root_dir}/ssl）
  systemd_unit_path: /lib/systemd/system/nginx.service  # Nginx systemd 服务文件路径
  version: latest  # 准备编译的 Nginx 版本，latest=安装时自动从 nginx.org 获取最新稳定版
  vhost_dir: ""  # 虚拟主机配置文件目录（留空则默认为 {install_path}/conf/vhost） 需要配置全路径地址 如：/usr/local/nginx/conf/vhost 
  data_root: ""  # 网站根目录（留空则默认使用 {system.root_dir}/dataroot）
  datalogs_root: ""  # Nginx 访问与错误日志目录（留空则默认使用 {system.root_dir}/datalogs）
postgres:
  image: postgres:15  # PostgreSQL Docker 镜像标签
  password: ""  # PostgreSQL 密码（留空则自动生成随机密码）
  port: 5432  # 映射到宿主机的 PostgreSQL 端口
rabbitmq:
  admin_pwd: ""  # RabbitMQ 管理员密码（留空则自动生成随机密码）
  admin_user: admin  # RabbitMQ 管理员用户名
  image: rabbitmq:3-management  # RabbitMQ Docker 镜像标签
  port: 5672  # 映射到宿主机的 RabbitMQ AMQP 端口
  ui_port: 15672  # 映射到宿主机的 RabbitMQ 管理后台端口
redis:
  image: redis:7-alpine  # Redis Docker 镜像标签
  password: ""  # Redis 访问密码（留空则自动生成随机密码）
  port: 6379  # 映射到宿主机的 Redis 端口
rocketmq:
  broker_port: 10911  # 映射到宿主机的 RocketMQ Broker 端口
  image: apache/rocketmq:5.3.0  # RocketMQ Docker 镜像标签
  namesrv_port: 9876  # 映射到宿主机的 RocketMQ NameServer 端口
elk:
  elasticsearch_image: "elasticsearch:8.12.0"  # Elasticsearch Docker 镜像标签
  elasticsearch_port: 9200  # 映射到宿主机的 Elasticsearch REST API 端口
  kibana_image: "kibana:8.12.0"  # Kibana Docker 镜像标签
  kibana_port: 5601  # 映射到宿主机的 Kibana Web 界面端口
  logstash_image: "logstash:8.12.0"  # Logstash Docker 镜像标签
  logstash_port: 5044  # 映射到宿主机的 Logstash Beats 输入端口
  es_java_opts: "-Xms512m -Xmx512m"  # Elasticsearch JVM 堆内存大小限制设置
jenkins:
  image: "jenkins/jenkins:lts"  # Jenkins Docker 镜像标签
  port: 8080  # 映射到宿主机的 Jenkins Web 端口
  agent_port: 50000  # 映射到宿主机的 Jenkins Agent (JNLP) 端口
gitlab:
  image: "gitlab/gitlab-ce:latest"  # GitLab CE Docker 镜像标签
  port: 8082  # 映射到宿主机的 GitLab Web (HTTP) 端口
  ssh_port: 2222  # 映射到宿主机的 GitLab SSH 端口
  https_port: 8443  # 映射到宿主机的 GitLab HTTPS 端口
  puma_workers: 2  # Puma 并发 Worker 数（防止高核服务器默认启动几十个 Worker 耗尽内存导致超时崩溃）
  external_url: ""  # 外部访问 URL（留空则默认使用 http://localhost:8082）
minio:
  image: "minio/minio:RELEASE.2025-04-22T22-12-26Z" # MinIO docker image tag
  port: 9000                                      # MinIO API port mapped to the host
  console_port: 9001                              # MinIO Console port mapped to the host
  root_user: "minioadmin"                         # MinIO root access key / username
  root_password: ""                               # MinIO root secret key / password (auto-generated if empty)
nacos:
  image: "nacos/nacos-server:v2.3.2"              # Nacos Docker image tag
  port: 8848                                      # Nacos Web Console/API port mapped to the host
  grpc_port_1: 9848                               # gRPC client port (usually port + 1000)
  grpc_port_2: 9849                               # gRPC member port (usually port + 1001)
  auth_enable: true                               # Whether to enable Nacos console authentication
  auth_token: ""                                  # Nacos token secret (min 32 chars base64, auto-generated if empty)
k8s:
  kubeconfig: ""                                  # 指定 kubeconfig 文件路径 (留空则默认读取 ~/.kube/config 或 $KUBECONFIG)
  namespace: "default"                            # 默认资源和外部服务注册的命名空间
  engine: "k3s"                                   # 默认轻量级 Kubernetes 集群引擎 (k3s)
  version: "v1.31.2+k3s1"                         # 默认 K3s 发行版安装版本
  data_dir: ""                                    # 宿主机 K3s 持久化数据存储路径（留空则默认使用 {system.root_dir}/k3s）
  install_script_url: "https://rancher-mirror.rancher.cn/k3s/k3s-install.sh"  # K3s 安装脚本 URL (支持国内镜像源或自定义源脚本)
  dashboard:
    type: "kuboard"                               # 默认部署的 Web 管理面板类型
    port: 30080                                   # Kuboard v3 控制台 NodePort 端口


